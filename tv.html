<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="refresh" content="30"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><title>Modo TV — PH</title></head><body class="tv-body"><header><img src="/static/logo.png"><div><b>CENTRAL DE ATENDIMENTOS</b><span>{{now.strftime('%d/%m/%Y %H:%M')}}</span></div></header><main><div class="tv-table"><div class="tv-row head"><span>HORÁRIO</span><span>VEÍCULO</span><span>STATUS</span></div>{% for r in rows %}<div class="tv-row {% if r.status=='ready' %}ready{% endif %}"><strong>{{r.appointment_time}}</strong><strong>{{r.model|upper}}</strong><span>{{status_labels[r.status]}}</span></div>{% else %}<div class="tv-empty">Nenhum atendimento na agenda de hoje.</div>{% endfor %}</div></main></body></html>
