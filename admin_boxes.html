{% extends 'admin_base.html' %}{% block content %}<div class="admin-head"><div><span>OPERAÇÃO</span><h1>Boxes</h1></div></div><form class="card inline-form" method="post"><label>Novo box<input name="name" placeholder="Ex.: Box 01" required></label><button class="btn gold">Criar</button></form><div class="grid-3 admin-section">{% for r in rows %}<article class="card"><h3>{{r.name}}</h3><p>{{'ATIVO' if r.active else 'INATIVO'}}</p><form method="post" action="/admin/boxes/{{r.id}}/toggle"><button class="btn ghost">{{'Desativar' if r.active else 'Ativar'}}</button></form></article>{% else %}<div class="notice">Nenhum box cadastrado.</div>{% endfor %}</div>{% endblock %}
