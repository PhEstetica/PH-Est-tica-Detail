{% extends 'base.html' %}{% block content %}<section class="shell section auth-grid"><div><div class="section-head"><span>ÁREA DO CLIENTE</span><h1>Sua garagem e seu histórico em um só lugar.</h1><p>Cadastro simples, priorizando telefone/WhatsApp.</p></div><img class="auth-logo" src="/static/logo.png"></div><div class="auth-panels">{% if error %}<div class="notice error">{{error}}</div>{% endif %}<form class="card form-stack" method="post" action="/login"><h2>Entrar</h2><label>WhatsApp<input name="phone" required></label><label>PIN<input name="pin" type="password" required></label><button class="btn gold">Entrar</button></form><form class="card form-stack" method="post" action="/registrar"><h2>Criar conta</h2><label>Nome<input name="name" required></label><label>WhatsApp<input name="phone" required></label><label>Crie um PIN<input name="pin" type="password" minlength="4" required></label><button class="btn ghost">Cadastrar</button></form></div></section>{% endblock %}
