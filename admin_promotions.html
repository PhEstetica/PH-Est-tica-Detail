{% extends 'admin_base.html' %}{% block content %}<div class="admin-head"><div><span>CAMPANHAS</span><h1>Promoções</h1><p>Nenhuma promoção falsa é criada automaticamente.</p></div></div><form class="card form-grid" method="post"><label>Título<input name="title" required></label><label>Público<input name="audience"></label><label>Início<input type="date" name="start_date"></label><label>Fim<input type="date" name="end_date"></label><label class="full">Descrição<textarea name="description"></textarea></label><label class="check inline"><input type="checkbox" name="active" value="1"><span>Publicar agora</span></label><button class="btn gold">Criar campanha</button></form><div class="grid-3 admin-section">{% for r in rows %}<article class="card"><span class="pill">{{'ATIVA' if r.active else 'RASCUNHO'}}</span><h3>{{r.title}}</h3><p>{{r.description}}</p></article>{% endfor %}</div>{% endblock %}
